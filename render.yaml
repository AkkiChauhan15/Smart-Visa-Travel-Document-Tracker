services:
  - type: web
    name: smart-visa-tracker-web
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --prefix backend && npm ci --prefix frontend && npm run build --prefix frontend
    startCommand: npm start --prefix backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: COOKIE_SECURE
        value: "true"
      - key: SERVE_FRONTEND
        value: "true"
      - key: UPLOAD_DIR
        value: /tmp/svt-uploads
      - key: MAX_UPLOAD_BYTES
        value: "5242880"
      - key: REMINDER_JOB_ENABLED
        value: "true"
      - key: REMINDER_JOB_INTERVAL_MS
        value: "86400000"
      - key: REMINDER_RUN_ON_STARTUP
        value: "false"
      - key: EMAIL_PROVIDER
        value: smtp
      - key: EMAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_CONNECTION_TIMEOUT_MS
        value: "10000"
